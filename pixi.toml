# PRISCREEN dependencies, managed with pixi (https://pixi.sh).
#
#   pixi install            # creates ./.pixi with snakemake and every tool the rules call
#   pixi run priscreen -n   # dry run of the workflow (= snakemake -n)
#   pixi run test           # unit and workflow tests on the toy data
#
# Only the community channels conda-forge and bioconda are used; no Anaconda
# "defaults" channel, which requires a commercial licence for many organisations.

[workspace]
name = "priscreen"
version = "0.2.0"
description = "PRISCREEN: species identification from ONT custom-amplicon and rRNA-amplicon reads"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
snakemake = ">=9.0"
snakemake-executor-plugin-slurm = ">=1.0"
pandas = ">=2.2"
pysam = ">=0.22"
pyyaml = "*"
minimap2 = ">=2.28"
samtools = ">=1.20"
vsearch = ">=2.28"
mmseqs2 = ">=15.6"
racon = ">=1.5"
medaka = ">=2.0"
chopper = ">=0.9"
graphviz = "*"
matplotlib-base = "*"
pytest = "*"

# Slim environment for cluster hosts that run every job in the container: Snakemake and the
# SLURM executor only (pixi install -e host; pixi run -e host snakemake --profile profiles/slurm).
[feature.host.dependencies]
python = "3.11.*"
snakemake = ">=9.0"
snakemake-executor-plugin-slurm = ">=1.0"
pandas = ">=2.2"
pyyaml = "*"

[environments]
host = { features = ["host"], no-default-feature = true }

[tasks]
priscreen = "snakemake --cores all"
test = "pytest -q tests"
figure = "python docs/make_pipeline_figure.py"
rulegraph = "snakemake --rulegraph | dot -Tpng -o rulegraph.png"
