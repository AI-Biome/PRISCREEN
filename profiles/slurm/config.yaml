# Snakemake profile for SLURM clusters:  snakemake --profile profiles/slurm
# Run it from the pixi environment (pixi shell, or pixi run snakemake ...); the
# jobs inherit PATH, so every tool comes from ./.pixi. Memory and runtime of the
# rules are derived from config/config.yaml (resources: mem_mb_per_cpu, runtime_min).
executor: slurm
jobs: 50
printshellcmds: true
rerun-incomplete: true
keep-going: true
default-resources:
  - slurm_partition=batch     # your partition
  # - slurm_account=myaccount
